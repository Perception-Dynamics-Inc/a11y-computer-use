<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cuagent login</title>
</head>
<body>
  <h1>Sign in</h1>
  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" aria-label="Username" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" aria-label="Password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <p id="login-result" role="status" aria-label="Login result"></p>
</body>
</html>
