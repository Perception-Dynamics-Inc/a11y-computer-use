<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cuagent otp</title>
</head>
<body>
  <h1>Two-factor check</h1>
  <form id="otp-form">
    <label for="otp">One-time code</label>
    <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code"
           aria-label="One-time code" maxlength="6">
    <button type="submit">Verify code</button>
  </form>
  <p>Enter the one-time password from your authenticator. This is a 2fa challenge, not a login form.</p>
</body>
</html>
