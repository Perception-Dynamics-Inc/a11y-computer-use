<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>cuagent card</title>
</head>
<body>
  <h1>Payment</h1>
  <form id="pay-form">
    <label for="card">Card number</label>
    <input id="card" name="cc-number" type="text" inputmode="numeric" autocomplete="cc-number"
           aria-label="Card number">
    <label for="cvv">Security code</label>
    <input id="cvv" name="cc-csc" type="text" inputmode="numeric" autocomplete="cc-csc"
           aria-label="Security code">
    <button type="submit">Pay</button>
  </form>
  <p>Card payment. Do not type a real card number.</p>
</body>
</html>
