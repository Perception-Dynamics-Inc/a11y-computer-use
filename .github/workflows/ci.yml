name: CI

on:
  push:
    branches: [main, computeruse-mvp]
  pull_request:

jobs:
  macos:
    name: macOS · full suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: pytest (live/TCC-gated tests auto-skip on CI)
        run: pytest -q

  windows:
    name: Windows · cross-platform structure
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # pyobjc is gated to sys_platform == 'darwin', so this installs cleanly on
      # Windows; the [windows] extra pulls the UIA deps for the live backend.
      - run: pip install -e ".[dev,windows]"
      - name: import + driver selection smoke
        run: >
          python -c "import computeruse;
          from computeruse.drivers import get_driver, current_platform;
          d = get_driver();
          print('platform:', current_platform(), '| driver:', d.name);
          assert d.name == 'windows', d.name"
      # The shared, platform-free core (schema, pruning engine, ref lifecycle)
      # and the driver seam must pass on Windows too — that's the whole point of
      # the Driver abstraction.
      - name: platform-free core + driver seam
        run: pytest tests/test_drivers.py tests/test_observe.py -q
      # The MCP server (Runtime + 12-tool surface) must import and build on
      # Windows — an agent has to be able to run `computeruse mcp` there.
      - name: MCP server imports + builds on Windows
        run: >
          python -c "import computeruse.server as s;
          srv = s.build_server();
          assert srv is not None and srv.name == 'computeruse', srv;
          print('MCP server built on Windows:', srv.name)"
      # The live Windows backend: UIA snapshot of Notepad through the SHARED
      # pruning engine, on a real windows-latest runner.
      - name: windows backend (live UIA)
        run: pytest tests/test_windows_live.py -q -s
