name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs the FULL hermetic suite (`pytest -q -rs`): tests that need a
# platform, a TCC grant, a display, or a CDP endpoint self-skip and print why.
# Each job then adds the live proof only that runner can give. docs/ci.md
# explains what each job proves and how to reproduce it locally.
jobs:
  macos:
    name: macOS · full suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,browser]"
      # The TCC-gated live tests run when the runner image holds the
      # Accessibility / Screen Recording grants and skip when it does not; the
      # ungranted-path tests do the reverse. -rs prints which way it went.
      - name: pytest (full suite; TCC-gated tests skip in either direction depending on the runner's grants)
        run: pytest -q -rs -p no:cacheprovider

  windows:
    name: Windows · full suite + live UIA
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # pyobjc is gated to sys_platform == 'darwin', so this installs cleanly on
      # Windows; the [windows] extra pulls the UIA deps for the live backend and
      # [browser] adds websocket-client so the browser modules import.
      - run: pip install -e ".[dev,windows,browser]"
      - name: import + driver selection smoke
        run: >
          python -c "import a11y_computer_use;
          from a11y_computer_use.drivers import get_driver, current_platform;
          d = get_driver();
          print('platform:', current_platform(), '| driver:', d.name);
          assert d.name == 'windows', d.name"
      # The whole hermetic suite must pass on Windows: the platform-free core
      # (schema, pruning engine, ref lifecycle, safety, Runtime, MCP surface,
      # agent loop, adapters, benchmark harness) and the driver seam. macOS-only
      # modules (the CGEvent executor, the overlay) skip at collection.
      - name: pytest (full hermetic suite)
        run: pytest -q -rs -p no:cacheprovider
      # The MCP server (Runtime + the 25-tool surface; console, network, and
      # webmcp are added only on the browser backend) must import and build on Windows: an
      # agent has to be able to run `a11y-computer-use mcp` there.
      - name: MCP server imports + builds on Windows
        run: >
          python -c "import a11y_computer_use.server as s;
          srv = s.build_server();
          assert srv is not None and srv.name == 'a11y-computer-use', srv;
          print('MCP server built on Windows:', srv.name)"
      # The live Windows backend on a real windows-latest runner: UIA snapshot of
      # Notepad through the SHARED pruning engine, a11y press + SendInput typing,
      # a ctrl+a key chord, and the gated Runtime end to end (test_windows_live.py).
      - name: windows backend (live UIA)
        run: pytest tests/test_windows_live.py -q -rs -s -p no:cacheprovider

  browser:
    name: Browser · CDP backend (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # The [browser] extra is just websocket-client; CDP discovery uses stdlib.
      - run: pip install -e ".[dev,browser]"
      # Hermetic first: the transport seam means the full observe + act mapping,
      # the adapters, the agent loop, and the head-to-head harness are asserted
      # with a scripted fake transport and NO browser.
      - name: browser stack (hermetic, fake transport)
        run: >
          pytest tests/test_browser.py tests/test_adapters.py tests/test_agent.py
          tests/test_providers.py tests/test_h2h.py tests/test_arena.py -q -rs -p no:cacheprovider
      # Then the real thing: a11y-first observe->act->verify against headless
      # Chrome. This is the payoff of a coordinate-free backend: the whole loop
      # runs in a container with no display, no window manager, no pixels.
      - name: launch headless Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          echo "using $CHROME"
          # --disable-dev-shm-usage: the runner's /dev/shm is tiny and headless
          # Chrome crashes on startup without it (the classic CI flake).
          "$CHROME" --headless=new --remote-debugging-port=9222 \
            --remote-debugging-address=127.0.0.1 --user-data-dir="$RUNNER_TEMP/a11y-computer-use-chrome" \
            --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --no-default-browser-check --window-size=1280,800 about:blank >/tmp/chrome.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null 2>&1 && up=1 && break
            sleep 0.5
          done
          if [ -z "${up:-}" ]; then
            echo "::error::headless Chrome did not expose CDP on :9222"; cat /tmp/chrome.log; exit 1
          fi
          curl -s http://127.0.0.1:9222/json/version
      - name: browser backend (live headless Chromium)
        env:
          A11Y_COMPUTER_USE_CDP_ENDPOINT: http://127.0.0.1:9222
        # The live paths: observe->act->verify, iframe content stitched from a child
        # frame (getFullAXTree per frame + owner-offset geometry), console capture,
        # and network outcomes (status codes + failures).
        run: pytest tests/test_browser.py -k live -q -rs -p no:cacheprovider
      - name: cu-arena (a11y-vs-vision observation cost, live number)
        env:
          A11Y_COMPUTER_USE_CDP_ENDPOINT: http://127.0.0.1:9222
        # Prints the honest per-observation token comparison to the CI log (-s).
        run: pytest tests/test_arena.py -k live -q -rs -s -p no:cacheprovider
      # Provider executor adapters: an Anthropic-style pixel click on a real page
      # snaps to the element's accessibility ref and executes without coordinates.
      - name: provider adapters (live)
        env:
          A11Y_COMPUTER_USE_CDP_ENDPOINT: http://127.0.0.1:9222
        run: pytest tests/test_adapters.py -k live -q -rs -p no:cacheprovider
      # Reference agent loop: a scripted planner observes, acts by ref, verifies,
      # and stops, through the same gated Runtime the MCP server uses.
      - name: agent loop (live, scripted planner)
        env:
          A11Y_COMPUTER_USE_CDP_ENDPOINT: http://127.0.0.1:9222
        run: pytest tests/test_agent.py -k live -q -rs -p no:cacheprovider
      # Head-to-head harness: scripted planner solves tasks in refs mode and in
      # pixels mode, and misclicks are counted by the instrumented pages.
      - name: cu-arena head-to-head harness (live, scripted planner)
        env:
          A11Y_COMPUTER_USE_CDP_ENDPOINT: http://127.0.0.1:9222
        run: pytest tests/test_h2h.py -k live -q -rs -p no:cacheprovider
      # Every snapshot view of the bound tab against one screenshot, printed.
      - name: bench desktop on the browser driver (printed)
        env:
          A11Y_COMPUTER_USE_DRIVER: browser
          A11Y_COMPUTER_USE_CDP_ENDPOINT: http://127.0.0.1:9222
        run: a11y-computer-use bench desktop --rounds 2
      - name: isolated browser workers (verified load smoke)
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p artifacts
          timeout -k 5 240 python scripts/box/load_browser.py --endpoint http://127.0.0.1:9222 \
            --workers 4 --iterations 10 --output artifacts/browser-load.json 2>&1 | tee artifacts/browser-load.log
      - name: retain browser load evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-load
          path: |
            artifacts/browser-load.json
            artifacts/browser-load.log
          if-no-files-found: ignore

  linux:
    name: Linux · full suite + live AT-SPI2 under a window manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The AT-SPI2 stack: the a11y bus (at-spi2-core), the GI typelibs the
      # driver imports (Atspi, Gtk3), apt's PyGObject (python3-gi), a virtual X
      # server + D-Bus session for the live run, a real window manager (openbox)
      # so focus and pointer semantics resemble a desktop, xdotool/x11-utils for
      # the pointer checks, and xclip for the clipboard. libreoffice-calc and
      # libreoffice-gtk3 are the Calc cell test. libreoffice-writer is the
      # Writer paragraph click and the Writer table-cell set_value test.
      # libreoffice-impress is the Impress title ref-click test and the
      # text-frame type test. The Lights template ships in libreoffice-common,
      # which calc already pulls in; without the impress component soffice
      # never exposes the slide frames. libreoffice-draw is the Draw shape
      # text test. Writer and Impress do not install sdraw; the test fails
      # when that binary is absent.
      # python3-pyqt6 is the
      # Qt fixture for the live line-edit, combo, and value test. The fixture
      # also accepts PySide6 and PyQt5. This job installs PyQt6: Ubuntu 24.04's
      # Qt 5 build ships no AT-SPI adaptor, so a PyQt5 window never appears
      # on the bus. pcmanfm, xterm, and mousepad are the Files, Terminal, and
      # Text Editor binaries the agent grant tests launch. Without one of each
      # family that test skips.
      # pcmanfm, not thunar: thunar pulls libxfce4ui and xfconf, and the live
      # step on that image never saw a Firefox AT-SPI tree. mousepad is the
      # key-outcome check: its document sits under a tab group.
      # gir1.2-vte-2.91 is the VTE widget the terminal snapshot test feeds.
      # xfce4-terminal is the notebook page-tab test (one tab and two tabs).
      # The package depends on libxfce4ui and libxfconf; thunar itself stays
      # uninstalled.
      - name: install AT-SPI2 / GTK / X11 system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core gir1.2-atspi-2.0 gir1.2-gtk-3.0 python3-gi python3-pyqt6 \
            libreoffice-calc libreoffice-gtk3 libreoffice-writer libreoffice-impress \
            libreoffice-draw \
            xvfb dbus dbus-x11 openbox xdotool x11-utils xclip tesseract-ocr \
            curl xz-utils libdbus-glib-1-2 libxt6t64 libasound2t64 \
            pcmanfm xterm mousepad gir1.2-vte-2.91 xfce4-terminal
      # Writer, Calc, and Impress do not install sdraw. The shape-text test
      # fails when Draw is absent, so install the component when the binary
      # is not already on the image.
      - name: install LibreOffice Draw when it is missing
        run: |
          if [ -x /usr/lib/libreoffice/program/sdraw ] || [ -x /usr/lib/libreoffice/program/sdraw.bin ]; then
            echo "Draw already installed"
            exit 0
          fi
          sudo apt-get install -y --no-install-recommends libreoffice-draw
          if [ ! -x /usr/lib/libreoffice/program/sdraw ] && [ ! -x /usr/lib/libreoffice/program/sdraw.bin ]; then
            echo "::error::libreoffice-draw did not install sdraw"
            exit 1
          fi
      # gnome-calculator and gnome-text-editor cover the GTK 4 bounds
      # live tests and the empty-field check. The Python entry fixtures
      # also need GTK 4 introspection bindings. A separate step, so the
      # shared apt list stays as it is.
      - name: install GTK 4 calculator and text editor
        run: |
          sudo apt-get install -y --no-install-recommends gnome-calculator gnome-text-editor gir1.2-gtk-4.0
          command -v gnome-calculator
          command -v gnome-text-editor
      # evince is the PDF page-text and side-pane thumbnail live tests.
      # A separate step, so the shared apt line stays as it is. The tests
      # skip when the binary is absent.
      - name: install Evince
        run: |
          sudo apt-get install -y --no-install-recommends evince
          command -v evince
      # OpenJDK 21 and the Java ATK Wrapper are the Swing JTable live test.
      # scroll_to_find must not type into a selected cell. A separate step,
      # so the shared apt line stays as it is.
      - name: install OpenJDK and the Java ATK wrapper
        run: |
          sudo apt-get install -y --no-install-recommends \
            openjdk-21-jdk libatk-wrapper-java libatk-wrapper-java-jni
          javac -version
          java -version
          dpkg-query -W libatk-wrapper-java libatk-wrapper-java-jni
      # inkscape is the SVG canvas, toolbox-name and zoom-percent live tests.
      # shared apt line stays as it is. The test skips when the binary
      # is absent.
      - name: install Inkscape
        run: |
          sudo apt-get install -y --no-install-recommends inkscape
          command -v inkscape
      # No setup-python here on purpose: apt's python3-gi is built for the
      # distro interpreter, and setup-python's cannot import it. So the venv is
      # created from the runner's /usr/bin/python3 with --system-site-packages;
      # gi/Atspi resolve from apt, everything else (a11y-computer-use, pytest,
      # python-xlib, pillow, websocket-client) from pip. The [linux] extra is
      # skipped so pip never tries to build PyGObject from source.
      - name: venv with system gi
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev,browser]" python-xlib
      - name: import + driver selection smoke
        run: >
          .venv/bin/python -c "import a11y_computer_use;
          from a11y_computer_use.drivers import get_driver, current_platform;
          d = get_driver();
          print('platform:', current_platform(), '| driver:', d.name);
          assert d.name == 'linux', d.name"
      # The whole hermetic suite on Linux, outside any X session: the
      # platform-free core, the driver seam, the bus-free synthetic AT-SPI and
      # XTEST tests, the agent loop, adapters, and benchmark harness. Display-
      # and bus-dependent tests skip here and run in the live step below.
      - name: pytest (full hermetic suite)
        run: .venv/bin/pytest -q -rs -p no:cacheprovider
      # The MCP server (Runtime + the 25-tool surface; console, network, and
      # webmcp are added only on the browser backend) must import and build on Linux: an
      # agent has to be able to run `a11y-computer-use mcp` there.
      - name: MCP server imports + builds on Linux
        run: >
          .venv/bin/python -c "import a11y_computer_use.server as s;
          srv = s.build_server();
          assert srv is not None and srv.name == 'a11y-computer-use', srv;
          print('MCP server built on Linux:', srv.name)"
      # Firefox ESR from Mozilla's public linux64 tarball when the runner has
      # no firefox binary. The form and hidden-tab tests launch it against
      # local pages. No paid browser service.
      - name: install Firefox ESR when it is missing
        run: |
          if command -v firefox >/dev/null 2>&1 || command -v firefox-esr >/dev/null 2>&1; then
            echo "firefox already on PATH: $(command -v firefox || command -v firefox-esr)"
            exit 0
          fi
          if [ -x /opt/firefox/firefox ]; then
            sudo ln -sfn /opt/firefox/firefox /usr/local/bin/firefox
            exit 0
          fi
          curl -fsSL -o /tmp/firefox.tar.xz \
            "https://download.mozilla.org/?product=firefox-esr-latest-ssl&os=linux64&lang=en-US"
          sudo tar -C /opt -xJf /tmp/firefox.tar.xz
          sudo ln -sfn /opt/firefox/firefox /usr/local/bin/firefox
          firefox --version
      # The live Linux backend on a real ubuntu-latest runner. Headless AT-SPI
      # needs three buses brought up in order: Xvfb (X server), dbus-run-session
      # (a session bus), and org.a11y.Bus (the a11y bus); at-spi-bus-launcher
      # lives at /usr/libexec on ubuntu-24.04 and is started explicitly with
      # --launch-immediately so the registry is up before the GTK app.
      # openbox gives the display an EWMH window manager, so real focus and an
      # active window exist: that is what turns tests/test_linux_desktop_live.py
      # (coordinate input with the pointer parked off-origin, the act-time
      # hit-test, apps/windows/clipboard, the gated Runtime) from skipped into
      # run. Xvfb without a window manager hid three pointer bugs
      # (docs/box-testbed.md). GTK_MODULES=gail:atk-bridge + NO_AT_BRIDGE=0
      # force GTK3's atk-bridge on so the app publishes its tree.
      # tests/test_agent_live.py is the M1 agent fixture. It launches the GTK
      # app and the local HTML pages (headless Chrome, already on the runner)
      # and drives Agent(...).run with a scripted model. Those cases skip only
      # when there is no Linux display, so this live step runs every one of
      # them. They are not a separate job.
      - name: linux backend (live AT-SPI2 + XTEST under openbox)
        env:
          GTK_MODULES: gail:atk-bridge
          NO_AT_BRIDGE: "0"
        # No manual pkill cleanup: the tests terminate their own GTK apps, and a
        # `pkill -f cuatestapp` self-matches the wrapping shell's command line and
        # SIGKILLs it (exit 137). The backgrounded a11y bus and window manager are
        # reaped as orphans by the runner. `timeout` (as the block's last command)
        # sets the exit code.
        run: |
          # Quoted heredoc at this block's indent. YAML strips that indent, so
          # the delimiter is column 0 for the shell. It stays outside the
          # single-quoted bash -c below; single-quoted echoes there are a
          # syntax error (exit 2) before pytest.
          cat > /tmp/wait_wm.py << 'PY'
          import time
          from Xlib import display
          deadline = time.monotonic() + 20
          last = "no _NET_SUPPORTING_WM_CHECK"
          while time.monotonic() < deadline:
              d = None
              try:
                  d = display.Display()
                  root = d.screen().root
                  atom = d.intern_atom("_NET_SUPPORTING_WM_CHECK")
                  prop = root.get_full_property(atom, 0)
                  if prop is not None:
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  last = str(exc)
              finally:
                  if d is not None:
                      try:
                          d.close()
                      except Exception:
                          pass
              time.sleep(0.25)
          print(last)
          raise SystemExit(1)
          PY
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash -c '
            ( /usr/libexec/at-spi-bus-launcher --launch-immediately >/dev/null 2>&1 & )
            # 5400s. Runs 38134153855 (main) and 38134262805 (the click
            # and OCR branch) were killed with exit 124 at the 1800s
            # ceiling while pytest was still completing tests. The
            # one-notch Chrome document scroll makes the long-page
            # scroll_to_find cases slower than the 21-minute live step
            # on 0.4.62. -v prints one line per test so a killed run
            # names the last test. This step installs the [ocr] extra
            # after the hermetic suite and runs the OCR live cases.
            # openbox starts after that install. Run 38107287671 started it
            # first and then installed the [ocr] wheels; the live pytest
            # then saw no _NET_SUPPORTING_WM_CHECK. Snapshots still found
            # Chrome and Firefox on AT-SPI, and activate_app failed with
            # "no running application matches" for the rest of the file.
            # Its own session keeps a later killpg from reaping the WM.
            .venv/bin/pip install -e ".[ocr]" &&
            export PYTHONUNBUFFERED=1
            setsid openbox > /tmp/openbox.log 2>&1 < /dev/null &
            .venv/bin/python /tmp/wait_wm.py || { echo "openbox log:"; cat /tmp/openbox.log; exit 1; }
            A11Y_OCR_LIVE=1 timeout -k 5 5400 stdbuf -oL -eL .venv/bin/pytest tests/test_linux_live.py tests/test_linux_desktop_live.py tests/test_linux_firefox_live.py tests/test_linux_untrusted_live.py tests/test_linux_ocr_live.py tests/test_agent_live.py tests/test_linux_gtk4_live.py tests/test_linux_gtk4_empty_value_live.py tests/test_evince_thumbnails.py tests/test_evince_page_text.py tests/test_linux_swing_live.py tests/test_inkscape_canvas.py tests/test_inkscape_zoom.py tests/test_inkscape_toolbar.py -v -rs --tb=line -p no:cacheprovider
          '

  package:
    name: Package · wheel + sdist build, uvx smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # hatchling builds both artifacts; the sdist excludes the brand assets,
      # the hero GIF, and the Box scripts (pyproject [tool.hatch.build.targets.sdist]).
      - name: uv build
        run: |
          uv build
          ls -la dist
          if tar tzf dist/*.tar.gz | grep -E 'docs/assets/|hero-demo.gif'; then
            echo "::error::sdist contains media that should be excluded"; exit 1
          fi
      # The wheel installs and the console script runs from an isolated
      # environment, the same shape as `uvx a11y-computer-use` from PyPI.
      # This step installs the wheel just built, not the copy already on the index.
      - name: uvx from the built wheel
        run: uvx --from "$(ls dist/*.whl)" a11y-computer-use --help
      - name: import the wheel in a fresh venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet "$(ls dist/*.whl)"
          /tmp/wheel-venv/bin/python -c "import a11y_computer_use, a11y_computer_use.server, a11y_computer_use.agent, a11y_computer_use.adapters, a11y_computer_use.h2h; print('wheel imports ok', a11y_computer_use.__version__ if hasattr(a11y_computer_use, '__version__') else '')"
      # A plain install, not the [linux] extra. python-xlib is a core
      # dependency on Linux, so this venv can list an X11 window.
      # The checker is written with echo so every line stays indented:
      # a column-0 line ends the YAML block and the workflow file fails
      # to parse, which starts none of the jobs.
      - name: clean install lists windows
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox x11-utils
          {
            echo 'import importlib.metadata as md'
            echo 'import time'
            echo 'reqs = md.requires("a11y-computer-use") or []'
            echo 'assert any("python-xlib" in r and "linux" in r for r in reqs), reqs'
            echo 'from a11y_computer_use.drivers._linux_system import windows'
            echo 'deadline = time.monotonic() + 8'
            echo 'rows = []'
            echo 'blob = ""'
            echo 'while True:'
            echo '    rows = windows()'
            echo '    blob = " ".join((str(r.get("app") or "") + " " + str(r.get("title") or "")).lower() for r in rows)'
            echo '    if "xmessage" in blob or "clean-install-window" in blob or time.monotonic() >= deadline:'
            echo '        break'
            echo '    time.sleep(0.25)'
            echo 'print(rows)'
            echo 'raise SystemExit(0 if ("xmessage" in blob or "clean-install-window" in blob) else 1)'
          } > /tmp/list-windows.py
          # xprop exits 0 when the atom is missing, so the ready check has to
          # see a window id. xmessage mapped before that never enters
          # _NET_CLIENT_LIST.
          # Run 38286187392 set _NET_SUPPORTING_WM_CHECK and then listed []
          # for the whole poll. The property can land before openbox adopts
          # a client, and an xmessage started in that gap never joins
          # _NET_CLIENT_LIST. setsid keeps the WM off the shell's process
          # group. The message is started only after the check holds.
          # A process that stays alive but never appears in the client list
          # is replaced, not left running.
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            setsid openbox >/tmp/openbox-pkg.log 2>&1 < /dev/null &
            ready=0
            for _ in $(seq 1 40); do
              if xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id"; then
                ready=1
                break
              fi
              sleep 0.25
            done
            if [ "$ready" -ne 1 ]; then
              echo "openbox log:"
              cat /tmp/openbox-pkg.log
              exit 1
            fi
            sleep 0.5
            if ! xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q "window id"; then
              echo "openbox log:"
              cat /tmp/openbox-pkg.log
              exit 1
            fi
            : > /tmp/xmessage-pkg.log
            xmessage -timeout 30 clean-install-window >>/tmp/xmessage-pkg.log 2>&1 &
            restarts=0
            for _ in $(seq 1 40); do
              if /tmp/wheel-venv/bin/python /tmp/list-windows.py; then
                exit 0
              fi
              # A live xmessage that openbox never adopted stays out of
              # _NET_CLIENT_LIST. Process-death is not the only miss: run
              # 38300008066 printed [] for the whole poll while xmessage
              # was still alive. Replace it a few times.
              if [ "$restarts" -lt 4 ]; then
                restarts=$((restarts + 1))
                pkill -x xmessage >/dev/null 2>&1 || true
                sleep 0.2
                xmessage -timeout 30 clean-install-window >>/tmp/xmessage-pkg.log 2>&1 &
                sleep 0.3
              fi
              sleep 0.25
            done
            echo "openbox log:"
            cat /tmp/openbox-pkg.log
            echo "xmessage log:"
            cat /tmp/xmessage-pkg.log
            exit 1
          '
