name: Release

# Publishes computeruse to PyPI when a version tag is pushed, using PyPI
# trusted publishing (OIDC): no API token lives in the repo. One-time setup on
# pypi.org: project "computeruse" -> Publishing -> add a trusted publisher for
# owner Perception-Dynamics-Inc, repository computerUse, workflow release.yml,
# environment pypi. Until that exists the publish step fails with a clear
# "trusted publisher not configured" error and nothing else is affected.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: the tag must match pyproject's version
        run: |
          V=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          T="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$V" != "$T" ]; then echo "::error::tag v$T != pyproject version $V"; exit 1; fi
      - name: smoke the wheel through uvx
        run: uvx --from "$(ls dist/*.whl)" computeruse --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: attach the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "computerUse $GITHUB_REF_NAME" --notes "See CHANGELOG.md."
