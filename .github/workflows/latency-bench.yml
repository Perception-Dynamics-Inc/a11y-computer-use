name: Latency bench
on:
  pull_request:
    paths: ['a11y_computer_use/**', 'scripts/latency/**', '.github/workflows/latency-bench.yml']
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  latency-bench:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned desktop and baseline
        run: docker build -f scripts/latency/Dockerfile -t a11y-latency .
      - name: Interleaved offline native benchmark
        run: |
          mkdir -p latency-results
          docker run --rm --network none --shm-size=2g --cpuset-cpus=0,1 -v "$PWD/latency-results:/results" a11y-latency bash scripts/latency/session.sh /opt/baseline/bin/python scripts/latency/stress.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: latency-results
          path: latency-results/
          if-no-files-found: error
